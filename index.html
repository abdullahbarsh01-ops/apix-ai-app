<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APEX AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      align-items: center;
      justify-content: center;
    }

    .chat-container {
      width: 100%;
      max-width: 800px;
      height: 90vh;
      background-color: #1e293b;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .header {
      padding: 20px;
      background-color: #0f172a;
      border-bottom: 1px solid #334155;
      text-align: center;
    }

    .header h1 {
      font-size: 1.5rem;
      color: #38bdf8;
    }

    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 8px;
      max-width: 80%;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .user-message {
      background-color: #0284c7;
      color: white;
      align-self: flex-end;
    }

    .bot-message {
      background-color: #334155;
      color: #f8fafc;
      align-self: flex-start;
    }

    .bot-message img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 10px;
      display: block;
    }

    .input-area {
      padding: 15px;
      background-color: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: white;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    button {
      padding: 12px 24px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #0369a1;
    }

    button:disabled {
      background-color: #64748b;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="chat-container">
    <div class="header">
      <h1>APEX AI</h1>
    </div>
    <div class="chat-box" id="chatBox">
      <div class="message bot-message">Hello! How can I assist you today?</div>
    </div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Type your message or prompt..."
        onkeypress="if(event.key === 'Enter') sendMessage()">
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    // Connected to your live Render backend URL
    const API_URL = 'https://apix-ai-app.onrender.com/api/chat';

    async function sendMessage() {
      const inputEl = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const chatBox = document.getElementById('chatBox');
      const message = inputEl.value.trim();

      if (!message) return;

      appendMessage(message, 'user-message');
      inputEl.value = '';
      inputEl.disabled = true;
      sendBtn.disabled = true;

      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message bot-message';
      loadingDiv.innerText = 'Thinking...';
      chatBox.appendChild(loadingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: message })
        });

        const data = await res.json();
        chatBox.removeChild(loadingDiv);

        if (data.type === 'image') {
          const imgMessage = document.createElement('div');
          imgMessage.className = 'message bot-message';
          imgMessage.innerHTML = `<p>${data.prompt}</p><img src="data:image/png;base64,${data.image_b64}" alt="Generated Image">`;
          chatBox.appendChild(imgMessage);
        } else {
          appendMessage(data.response || 'No response generated.', 'bot-message');
        }
      } catch (err) {
        chatBox.removeChild(loadingDiv);
        appendMessage('Error connecting to backend server.', 'bot-message');
        console.error(err);
      } finally {
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    function appendMessage(text, className) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${className}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>

</html>
